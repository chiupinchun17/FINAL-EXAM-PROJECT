<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>登入系統</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .box { border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin-bottom: 20px; background-color: #fafafa; }
        .success-box { background-color: #e6ffed; border: 1px solid #2ea043; padding: 20px; border-radius: 8px; }
        .key-text { color: #d73a49; font-size: 48px; font-weight: bold; letter-spacing: 5px; margin: 15px 0; }
        input[type="text"] { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; text-align: center; font-size: 16px; }
        button { background-color: #0366d6; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background-color: #005cc5; }
        .error { color: white; background-color: #d73a49; padding: 10px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>👋 歡迎</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        {% if new_password %}
            <div class="success-box">
                <h3 style="margin-top: 0; color: #2ea043;">🎉 帳號建立成功</h3>
                <p>你好，<strong>{{ username }}</strong>！<br>這是系統為你配發的專屬密碼：</p>
                
                <div class="key-text">{{ new_password }}</div>
                
                <p style="font-size: 14px; color: #666;">⚠️ 下次登入只需輸入這 3 個數字<br>請務必牢記！</p>
                <a href="/" style="display: block; margin-top: 20px; text-decoration: none; background-color: #2ea043; color: white; padding: 12px 20px; border-radius: 5px; font-weight: bold;">進入留言板</a>
            </div>
        {% else %}
            <div class="box">
                <h3 style="margin-top: 0;">🆕 獲取密碼 (建立帳號)</h3>
                <p style="font-size: 14px; color: #666; margin-bottom: 15px;">第一次來嗎？輸入你的名字來獲取密碼</p>
                <form action="/register" method="POST">
                    <input type="text" name="username" placeholder="請輸入你的暱稱" required>
                    <button type="submit">產生 3 位數密碼</button>
                </form>
            </div>

            <div class="box">
                <h3 style="margin-top: 0;">🔑 輸入密碼 (直接登入)</h3>
                <p style="font-size: 14px; color: #666; margin-bottom: 15px;">已有密碼？輸入 3 位數字自動登入</p>
                <form action="/login" method="POST">
                    <input type="text" name="password" placeholder="輸入 3 位數 (例: 123)" required pattern="\d{3}" title="請輸入 3 個數字">
                    <button type="submit" style="background-color: #2ea043;">登入</button>
                </form>
            </div>
        {% endif %}
    </div>
</body>
</html>
